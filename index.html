<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ampero Stage Effect & Amp Models List</title>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-card: #222634;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --border: #2e3446;
      --cat-drv: #ef4444;
      --cat-amp: #f59e0b;
      --cat-dyn: #3b82f6;
      --cat-freq: #8b5cf6;
      --cat-wah: #10b981;
      --cat-eq: #06b6d4;
      --cat-mod: #ec4899;
      --cat-dly: #6366f1;
      --cat-rvb: #14b8a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span.badge-title {
      background: var(--accent);
      color: #000;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
    }

    .count-info {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .count-info strong {
      color: var(--accent);
    }

    /* 검색창 */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      display: none;
    }

    /* 필터 버튼 */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .sub-filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .filter-btn {
      background-color: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 6px 13px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .filter-btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* 메인 리스트 / 테이블 */
    main {
      padding: 20px;
    }

    .table-wrapper {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 13px 16px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* 카테고리 배지 */
    .cat-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      min-width: 48px;
      color: #fff;
    }

    .cat-DRV { background-color: var(--cat-drv); }
    .cat-AMP { background-color: var(--cat-amp); color: #000; }
    .cat-DYN { background-color: var(--cat-dyn); }
    .cat-FREQ { background-color: var(--cat-freq); }
    .cat-WAH { background-color: var(--cat-wah); color: #000; }
    .cat-EQ { background-color: var(--cat-eq); color: #000; }
    .cat-MOD { background-color: var(--cat-mod); }
    .cat-DLY { background-color: var(--cat-dly); }
    .cat-RVB { background-color: var(--cat-rvb); }

    .type-text {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .model-name {
      font-weight: 700;
      color: var(--text-primary);
    }

    .based-on {
      color: #cbd5e1;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-secondary);
    }

    /* 모바일 반응형 카드 뷰 */
    @media (max-width: 680px) {
      thead {
        display: none;
      }
      table, tbody, tr, td {
        display: block;
        width: 100%;
      }
      tr {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 3px 0;
        border: none;
      }
      td.col-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      td.col-model {
        font-size: 1.05rem;
      }
      td.col-based {
        font-size: 0.88rem;
        color: var(--text-secondary);
      }
      td.col-based::before {
        content: "Based on: ";
        color: #64748b;
      }
    }
  </style>
</head>

    <div class="container">
      <div class="header-top">
        <h1>
          Ampero Stage Models
          <span class="badge-title">Quick Reference</span>
        </h1>
        <div class="count-info">
          표시 중: <strong id="visibleCount">0</strong> / <span id="totalCount">0</span>개

      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="모델명 또는 원본 장비 검색 (예: TS-808, JCM900, Centaur, Chorus...)" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" title="검색어 지우기">&times;</button>
      </div>

      <div class="filter-group" id="categoryFilters"></div>
      <div class="sub-filter-group" id="typeFilters" style="display: none;"></div>
    </div>
  </header>

    </div>
  </main>

    const categoryFilters = document.getElementById("categoryFilters");
    const typeFilters = document.getElementById("typeFilters");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const visibleCountEl = document.getElementById("visibleCount");
    const totalCountEl = document.getElementById("totalCount");
    const emptyState = document.getElementById("emptyState");

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i + 1] === '"') {
            cur += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            row.push(cur.trim());
            cur = "";
          } else if (ch === "\n" || ch === "\r") {
            if (cur || row.length > 0) {
              row.push(cur.trim());
              rows.push(row);
              row = [];
              cur = "";
            }
          } else {
            cur += ch;
          }
        }
      }
      if (cur || row.length > 0) {
        row.push(cur.trim());
        rows.push(row);
      }
      return rows;
    }

    async function initData() {
      if (GOOGLE_SHEET_CSV_URL) {
        try {
          const res = await fetch(GOOGLE_SHEET_CSV_URL);
          const csvText = await res.text();
          const parsed = parseCSV(csvText);
          allItems = parsed
            .slice(1)
            .filter(r => r.length >= 4 && r[0] && r[2])
            .map(([category, type, model, basedOn]) => ({ category, type, model, basedOn }));
        } catch (e) {
          console.warn("CSV 로드 실패, 내장 데이터를 사용합니다.", e);
        }
      }

      if (allItems.length === 0) {
        allItems = FALLBACK_DATA.map(([category, type, model, basedOn]) => ({
          category, type, model, basedOn
        }));
      }

      totalCountEl.textContent = allItems.length;
      renderCategoryButtons();
      renderTable();
    }

    function renderCategoryButtons() {
      const categories = ["ALL", ...new Set(allItems.map(item => item.category))];
      categoryFilters.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat === "ALL" ? "전체 (ALL)" : cat;
        btn.addEventListener("click", () => {
          activeCategory = cat;
          activeType = "ALL";
          renderCategoryButtons();
          renderTypeButtons();
          renderTable();
        });
        categoryFilters.appendChild(btn);
      });
    }

    function renderTypeButtons() {
      if (activeCategory === "ALL") {
        typeFilters.style.display = "none";
        typeFilters.innerHTML = "";
        return;
      }

      const types = ["ALL", ...new Set(
        allItems.filter(i => i.category === activeCategory).map(i => i.type)
      )];

      if (types.length <= 2) {
        typeFilters.style.display = "none";
        return;
      }

      typeFilters.style.display = "flex";
      typeFilters.innerHTML = "";
      types.forEach(type => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (type === activeType ? " active" : "");
        btn.textContent = type === "ALL" ? "전체 타입" : type;
        btn.addEventListener("click", () => {
          activeType = type;
          renderTypeButtons();
          renderTable();
        });
        typeFilters.appendChild(btn);
      });
    }

    function renderTable() {
      const q = searchQuery.toLowerCase();
      const filtered = allItems.filter(item => {
        const matchCat = activeCategory === "ALL" || item.category === activeCategory;
        const matchType = activeType === "ALL" || item.type === activeType;
        const matchSearch = !q ||
          item.model.toLowerCase().includes(q) ||
          item.basedOn.toLowerCase().includes(q) ||
          item.type.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        return matchCat && matchType && matchSearch;
      });

      visibleCountEl.textContent = filtered.length;
      tableBody.innerHTML = "";

      if (filtered.length === 0) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      const fragment = document.createDocumentFragment();
      filtered.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="col-meta">
            <span class="cat-badge cat-${item.category}">${item.category}</span>
          </td>
          <td class="type-text">${item.type}</td>
          <td class="col-model model-name">${item.model}</td>
          <td class="col-based based-on">${item.basedOn}</td>
        `;
        fragment.appendChild(tr);
      });
      tableBody.appendChild(fragment);
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      clearBtn.style.display = searchQuery ? "block" : "none";
      renderTable();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearBtn.style.display = "none";
      searchInput.focus();
      renderTable();
    });

    initData();
  </script>
</body>
</html>
